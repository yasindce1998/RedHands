name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: true

      - name: Build
        run: go build ./...

      - name: Unit Tests
        run: go test -race -coverprofile=coverage.out ./...

      - name: Vet
        run: go vet ./...

      - name: Go vulnerability analysis
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

      - name: Shell syntax
        run: |
          for script in scripts/*.sh; do bash -n "$script"; done

      - name: Validate locked dependencies
        run: |
          python3 scripts/dependencies.py validate
          python3 -m unittest discover -s scripts -p 'test_*.py'

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.out

      - name: Lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.15.0

  integration-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: true

      - name: Integration Tests
        run: go test -race -v -run 'Test' ./tools/

  cross-platform:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: true
      - run: go build ./...
      - run: go test ./pkg/mcpclient ./pkg/execution ./pkg/mcp ./pkg/evidence ./pkg/loot ./tools/reporting ./tools/operations ./cmd/redhands-cli ./cmd/redhands-creds
      - name: Parse PowerShell installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile("$pwd/scripts/install-tools.ps1", [ref]$null, [ref]$errors) | Out-Null
          if ($errors) { $errors | Format-List; exit 1 }

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker Image
        run: docker build -t redhands:ci .
      - name: Isolated real-binary smoke test
        run: docker run --rm --network none -i --entrypoint python3 redhands:ci - < scripts/smoke.py

  # Verifies the wrapper argv fragments against the real binaries' CLIs
  # (help-text and dry-parse assertions; see tools/livecheck). Binaries come
  # from apt and from the checksum-verified pinned releases in
  # scripts/dependencies.json, mirroring the Docker image's tool set.
  live-binaries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: true

      - name: Install apt binaries
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            nmap masscan dnsutils tshark whatweb nikto john \
            python3-impacket sqlmap

      - name: Install pinned release binaries
        run: |
          mkdir -p "$HOME/.local/bin"
          for tool in chisel ligolo-proxy feroxbuster \
                      kubedagger-client kubedagger-operator kubedagger-server \
                      barzakh-scanner barzakh-adversary barzakh-server \
                      staticzero-defense staticzero-offense modem-firmware sdr-bridge \
                      aegis-shadow-defense aegis-shadow-offense aegis-c2; do
            python3 scripts/dependencies.py install "$tool" --output "$HOME/.local/bin"
          done
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install pinned Python tools
        run: |
          python3 -m pip install --user \
            "$(python3 scripts/dependencies.py python certipy)" \
            "$(python3 scripts/dependencies.py python arjun)"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install pinned Go tools
        run: |
          for tool in subfinder httpx nuclei ffuf katana gobuster gau waybackurls; do
            GOBIN="$HOME/.local/bin" CGO_ENABLED=0 go install "$(python3 scripts/dependencies.py go "$tool")"
          done

      - name: Live binary flag-surface tests
        run: go test -tags=livebin ./tools/livecheck/... -run TestLiveFlagSurface -v

  # Tier 3 live end-to-end tests: REAL tool execution through the full
  # server stack (JSON-RPC → middleware → wrapper → BinaryExecutor →
  # binary) against safe, test-owned local targets only; see tools/e2e.
  # Installs just the binaries the scenarios need (nmap via apt, nuclei
  # via the pinned go install, the rest via the checksum-verified pinned
  # releases in scripts/dependencies.json).
  live-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: true

      - name: Install apt binaries
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends nmap

      - name: Install pinned release binaries
        run: |
          mkdir -p "$HOME/.local/bin"
          for tool in barzakh-scanner barzakh-adversary \
                      staticzero-defense modem-firmware kubedagger-client; do
            python3 scripts/dependencies.py install "$tool" --output "$HOME/.local/bin"
          done
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install pinned Go tools
        run: |
          GOBIN="$HOME/.local/bin" CGO_ENABLED=0 go install "$(python3 scripts/dependencies.py go nuclei)"

      - name: Live end-to-end tests
        run: go test -tags=livee2e ./tools/e2e/... -v
